<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b74"><title>Guía rápida del Chillout</title><style>body{margin:0;padding:28px;background:#edf3fb;color:#173b74;font:18px Arial,sans-serif}main{max-width:640px;margin:auto;background:#fff;border:1px solid #c7d8f3;border-radius:18px;padding:22px}h1{font-size:27px;margin:0 0 10px}.error{color:#b42318}</style></head><body><main id="estado"><h1>Guía rápida del Chillout</h1><p>Cargando la guía...</p></main><script>(async()=>{const f=Array.from({length:15},(_,i)=>`v6/payload${String(i+1).padStart(2,"0")}.txt`);const b=(await Promise.all(f.map(x=>fetch(x,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(x);return r.text()})))).join("");const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const s=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));const h=await new Response(s).text();document.open();document.write(h);document.close()})().catch(()=>document.getElementById("estado").innerHTML='<h1>No se pudo cargar la guía</h1><p class="error">Recarga la página. Si el problema continúa, comprueba la conexión a Internet.</p>');</script></body></html>
